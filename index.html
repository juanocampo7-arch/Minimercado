<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MiniMarket">
<title>Minimercado POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.btn{padding:.85rem 1rem;border-radius:.75rem;font-weight:700;font-size:1rem}
.inp{width:100%;border:2px solid #d6d3d1;border-radius:.6rem;padding:.6rem;font-size:1rem;background:#fff}
.inp:focus{outline:3px solid #0f766e;border-color:#0f766e}
.tag{font-size:.7rem;font-weight:800;padding:.1rem .4rem;border-radius:.4rem}

html{color-scheme:dark}
html *{border-color:#2b3647}
html .border-red-500{border-color:#ef4444}
html .border-emerald-200{border-color:#047857}html .border-amber-200{border-color:#b45309}html .border-red-200{border-color:#b91c1c}
.bg-white{background:#151e2e!important}
.bg-stone-100{background:#1e293b!important}
.bg-stone-200{background:#27354a!important;color:#e5e7eb!important}
.text-stone-500,.text-stone-600{color:#94a3b8!important}
.text-teal-800,.text-teal-700{color:#5eead4!important}
.text-red-600,.text-red-700{color:#f87171!important}
.text-emerald-700,.text-emerald-800{color:#6ee7b7!important}
.text-blue-700{color:#7dd3fc!important}.text-amber-700{color:#fbbf24!important}
.text-emerald-900,.text-amber-900,.text-red-900{color:#f8fafc!important}
.bg-red-50{background:#3a1319!important}.bg-emerald-50{background:#06302b!important}.bg-amber-50{background:#3a2a07!important}
.tag.bg-red-100{background:#4c1620!important}.tag.bg-amber-200{background:#4a3408!important;color:#fcd34d!important}
.inp{background:#0b1220;border-color:#334155;color:#f1f5f9}
.inp::placeholder{color:#64748b}
select option{background:#0b1220;color:#f1f5f9}
body{padding-bottom:env(safe-area-inset-bottom)}
.btn:active{transform:scale(.97)}
#invp hr{border:0;border-top:1px dashed #000;margin:6px 0}
@page{size:80mm auto;margin:2mm}
@media print{body *{visibility:hidden}#invp,#invp *{visibility:visible}#invp{position:fixed;left:0;top:0;width:76mm;max-width:76mm}}
@media(max-width:767px){.btn{padding:.7rem .8rem}}
</style></head>
<body class="bg-slate-950 text-slate-100">
<div id="app"></div><div id="modal"></div><div id="toast" class="fixed bottom-28 md:bottom-4 left-1/2 -translate-x-1/2 z-[60]"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,onSnapshot,addDoc,updateDoc,setDoc,deleteDoc,writeBatch,increment,query,where,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ========== PEGA AQUÍ TUS CREDENCIALES DE FIREBASE ========== */
const firebaseConfig = {
  apiKey: "AIzaSyAYDvxRsjjRBIsVDi6Q-PF2_eB3bfuUyM8",
  authDomain: "minimercado-faa32.firebaseapp.com",
  projectId: "minimercado-faa32",
  storageBucket: "minimercado-faa32.firebasestorage.app",
  messagingSenderId: "63978869362",
  appId: "1:63978869362:web:6771e40f8512b19075a8eb"
};
/* ============================================================ */

const app=initializeApp(firebaseConfig), db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(n||0));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const toast=m=>{const t=$('#toast');t.innerHTML=`<div class="bg-slate-700 border border-slate-500 text-white px-5 py-3 rounded-xl shadow-lg font-semibold">${esc(m)}</div>`;setTimeout(()=>t.innerHTML='',2800)};

// ---- Fases y subcategorías ----
const PHASES=[
 {id:'salud',n:'Salud e Higiene',ic:'🧴',subs:['Estantería Aseo Personal','Papelería / Hogar','Mascotas']},
 {id:'mercado',n:'Mercado y Despensa',ic:'🌾',subs:['Granos y Harinas','Arepas y Panadería','Aceites y Enlatados','Condimentos y Salsas','Café, Chocolate y Cereales']},
 {id:'mecato',n:'Mecato y Dulcería',ic:'🍟',subs:['Góndola Papitas','Dulcería y Galletas','Helados']},
 {id:'neveras',n:'Neveras',ic:'❄️',subs:['Nevera Postobón','Nevera Coca-Cola','Nevera Bavaria (Cerveza)']},
 {id:'vitrinas',n:'Vitrinas',ic:'🪟',subs:['Vitrina Licores / Alcohol','Vitrina Lácteos / Quesos','Estante Cereales','Vitrina Cigarrillos']},
 {id:'carnes',n:'Carnes y Pescados',ic:'🥩',subs:['Congelador Carnes','Congelador Pescados / Pollo']},
 {id:'fruver',n:'Revueltería (Fruver)',ic:'🥔',subs:['Canastillas Fruver (Peso)']}
];
const phName=id=>PHASES.find(p=>p.id===id)?.n||id;
const findPhase=s=>{s=norm(s);return PHASES.find(p=>p.id===s||norm(p.n).startsWith(s)||s.startsWith(p.id))?.id||'mercado'};
const isW=p=>p.saleType==='gramo';
const stockTxt=p=>isW(p)?(p.stock/1000).toFixed(2)+' kg':p.stock;

let S={biz:{},entries:[],fSub:'all',user:null,tab:'pos',products:[],sales:[],expenses:[],closes:[],since:0,subbed:false,
 cart:[],phase:'all',q:'',method:'efectivo',paid:0,cust:'',base:0,fPhase:'all',fQ:'',only0:false,audPhase:'mercado'};
let unsubs=[];

// ---- Autenticación ----

function loginView(){$('#app').innerHTML=`<div class="min-h-screen flex items-center justify-center p-4"><div class="bg-white rounded-2xl shadow p-6 w-full max-w-sm space-y-3">
<h1 class="text-2xl font-extrabold">Minimercado POS</h1>
<input id="em" class="inp" placeholder="Usuario" autocomplete="off"><input id="pw" class="inp" type="password" placeholder="Contraseña">
<button class="btn bg-teal-700 text-white w-full" onclick="login()">Entrar</button></div></div>`}
window.login=()=>{if($('#em').value.trim().toLowerCase()==='admin'&&$('#pw').value==='1234'){S.user='admin';try{localStorage.setItem('pos_user','admin')}catch(e){}start()}else toast('Usuario o clave incorrectos')};

function start(){
 const col=(n,fn,q)=>onSnapshot(q||collection(db,n),s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));refresh()});
 unsubs.forEach(x=>x());
 unsubs=[col('products',a=>S.products=a.sort((x,y)=>x.name.localeCompare(y.name)))];
 unsubs.push(onSnapshot(query(collection(db,'purchases'),orderBy('ts','desc'),limit(15)),q=>{S.entries=q.docs.map(d=>d.data());refresh()}));
 unsubs.push(onSnapshot(doc(db,'config','negocio'),d=>{S.biz=d.data()||{};refresh()}));
 unsubs.push(onSnapshot(query(collection(db,'closes'),orderBy('ts','desc'),limit(30)),s=>{
  S.closes=s.docs.map(d=>({id:d.id,...d.data()}));const since=S.closes[0]?.ts||0;
  if(!S.subbed||since!==S.since){S.since=since;S.subbed=true;shiftSubs()}refresh()}));
 shell();
}
function shiftSubs(){ // ventas y gastos del turno actual (desde el último cierre)
 S.shiftU?.forEach(x=>x());
 const f=(n,k)=>onSnapshot(query(collection(db,n),where('ts','>',S.since)),s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));refresh()});
 S.shiftU=[f('sales','sales'),f('expenses','expenses')];
}

// ---- Estructura general ----
const TABS=[['pos','Caja'],['inv','Productos'],['ent','Compras'],['falt','Faltan'],['cuadre','Cuadre'],['neg','Negocio']];
const ICON={pos:'🛒',inv:'📦',ent:'🚚',falt:'📋',cuadre:'💰',neg:'⚙️'};
function shell(){
 const nav=TABS.map(([k,l])=>{const on=S.tab===k;return `<button onclick="go('${k}')" class="relative flex-1 md:flex-none flex flex-col md:flex-row items-center md:gap-3 rounded-2xl md:px-3 py-1 md:py-2.5 transition ${on?'md:bg-gradient-to-r md:from-emerald-500 md:to-teal-500 md:text-white md:shadow-lg text-emerald-300':'text-slate-400 hover:text-white md:hover:bg-slate-800'}">
 <span class="grid place-items-center w-10 h-8 md:w-9 md:h-9 rounded-xl text-xl md:text-lg transition ${on?'bg-gradient-to-br from-emerald-400 to-teal-500 shadow-lg shadow-emerald-500/30 -translate-y-1 md:translate-y-0':'md:bg-slate-800'}">${ICON[k]}</span>
 <span class="text-[10px] md:text-[15px] font-bold leading-tight">${l}</span>${k==='falt'?'<span id="bFalta" class="tag bg-rose-500 text-white absolute top-0 right-2 md:static md:ml-auto">0</span>':''}</button>`}).join('');
 $('#app').innerHTML=`<div class="md:flex min-h-screen"><aside class="fixed bottom-2 inset-x-2 md:static md:inset-auto z-40 flex md:flex-col gap-1 p-1.5 md:p-3 rounded-3xl md:rounded-none bg-slate-900/95 backdrop-blur border border-slate-700 md:border-0 md:border-r shadow-2xl md:shadow-none md:sticky md:top-0 md:h-screen md:w-64">
 <div class="hidden md:flex items-center gap-3 px-2 py-3 mb-2"><div class="grid place-items-center w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-400 to-teal-600 text-2xl shadow-lg shadow-emerald-500/30">🛒</div><div class="min-w-0"><div id="brandN" class="font-extrabold truncate text-white">${esc(S.biz.name||'MiniMarket PRO')}</div><div class="text-xs text-slate-400">Punto de venta</div></div></div>
 ${nav}
 <div class="hidden md:block mt-auto space-y-2"><button id="inst" class="hidden w-full btn bg-emerald-700 text-white" onclick="_dp&&_dp.prompt()">⬇ Instalar app</button>
 <div class="flex items-center gap-2 rounded-2xl bg-slate-800 p-2"><div class="grid place-items-center w-9 h-9 rounded-full bg-emerald-600 font-bold uppercase">${esc((S.user||'a')[0])}</div><div class="flex-1 text-sm font-bold">${esc(S.user)}</div><button class="text-slate-400 hover:text-white px-2" onclick="logout()" title="Salir">⎋</button></div></div></aside>
 <div class="flex-1 min-w-0"><div id="kpis" class="bg-white border-b px-3 py-2 flex gap-2 md:gap-3 overflow-x-auto sticky top-0 z-30 items-center"></div><main id="main" class="p-3 pb-32 md:pb-4 max-w-7xl mx-auto"></main></div></div>`;
 render();kpis();if(window._dp)$('#inst')?.classList.remove('hidden');
}
window.logout=()=>{S.user=null;try{localStorage.removeItem('pos_user')}catch(e){}unsubs.forEach(x=>x());S.shiftU?.forEach(x=>x());S.subbed=false;loginView()};
window.go=t=>{S.tab=t;shell()};
const render=()=>({pos:posView,inv:invView,ent:entView,falt:faltView,cuadre:cuadreView,neg:negView}[S.tab])();
function refresh(){ // actualiza sin perder el foco de lo que se está escribiendo
 if(!S.user||!$('#main'))return;kpis();
 if(S.tab==='pos')return renderGrid();
 const a=document.activeElement; if(a&&a.matches('input,select')&&$('#main').contains(a)&&S.tab!=='cuadre')return;
 if(S.tab==='cuadre'&&a&&a.matches('input'))return;
 render();
}
const badges=p=>(p.price<=0?'<span class="tag bg-red-600 text-white">SIN PRECIO</span> ':'')+
 (p.stock<=0?'<span class="tag bg-red-100 text-red-700">AGOTADO</span>':p.stock<=(p.min||0)?'<span class="tag bg-amber-200 text-amber-800">BAJO</span>':'');

// ================= CAJA (POS) =================
function posView(){
 $('#main').innerHTML=`<div class="grid lg:grid-cols-3 gap-3"><section class="lg:col-span-2 space-y-2">
 <input id="q" class="inp text-lg" placeholder="Buscar por nombre o código…" value="${esc(S.q)}" oninput="S.q=this.value;renderGrid()" onkeydown="if(event.key==='Enter')quickAdd()">
 <div class="flex gap-2 overflow-x-auto pb-1"><button class="btn ${S.phase==='all'?'bg-teal-700 text-white':'bg-white'}" onclick="S.phase='all';posView()">Todas</button>
 ${PHASES.map(p=>`<button class="btn whitespace-nowrap ${S.phase===p.id?'bg-teal-700 text-white':'bg-white'}" onclick="S.phase='${p.id}';posView()">${p.n}</button>`).join('')}</div>
 <div id="grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-2"></div></section>
 <aside id="cart" class="bg-white rounded-2xl shadow p-3 space-y-2 h-fit lg:sticky lg:top-16"></aside><button id="mbar" class="hidden lg:!hidden fixed bottom-24 right-3 z-30 btn bg-emerald-600 text-white shadow-xl" onclick="$('#cart').scrollIntoView({behavior:'smooth'})"></button></div>`;
 renderGrid();renderCart();if(innerWidth>=768)$('#q').focus();
}
window.S=S;window.posView=posView;
window.renderGrid=function(){
 const g=$('#grid');if(!g)return;const q=norm(S.q);
 const l=S.products.filter(p=>(S.phase==='all'||p.phase===S.phase)&&(!q||norm(p.name).includes(q)||norm(p.code)===q)).slice(0,80);
 g.innerHTML=l.map(p=>`<button onclick="pick('${p.id}')" class="text-left bg-white rounded-xl p-3 shadow border-2 ${p.price<=0?'border-red-500':'border-transparent'} active:scale-95">
 <div class="font-bold leading-tight">${esc(p.name)}</div><div class="text-xs text-stone-500">${esc(p.sub||phName(p.phase))}</div>
 <div class="text-lg font-extrabold text-teal-800">${isW(p)?fmt(p.price/2)+'<span class="text-xs font-normal">/libra</span>':fmt(p.price)}</div>
 <div class="text-sm">Stock: ${stockTxt(p)}</div><div>${badges(p)}</div></button>`).join('')||'<p class="p-4 text-stone-500">Sin resultados.</p>';
};
window.pick=id=>{const p=S.products.find(x=>x.id===id);if(!p)return;
 if(p.price<=0)return toast('Este producto tiene precio $0. Defínelo en Inventario.');
 if(p.stock<=0)return toast('Producto agotado');isW(p)?openW(p):addCart(p,1)};
function addCart(p,qty){
 const i=S.cart.find(x=>x.id===p.id);
 if((i?i.qty:0)+qty>p.stock)return toast('Solo quedan '+stockTxt(p)+' en inventario');
 if(i)i.qty+=qty;else S.cart.push({id:p.id,name:p.name,w:isW(p),qty,price:p.price});
 renderCart();
}
const sub=i=>i.w?Math.round(i.qty*i.price/1000):i.qty*i.price;
const total=()=>S.cart.reduce((a,i)=>a+sub(i),0);
function renderCart(){
 const c=$('#cart');if(!c)return;const t=total();
 c.innerHTML=`<h2 class="text-xl font-extrabold">Venta actual</h2>
 ${S.cart.map((i,n)=>`<div class="flex items-center gap-2 border-b py-1"><div class="flex-1"><div class="font-semibold leading-tight">${esc(i.name)}</div>
 <div class="text-sm text-stone-500">${i.w?i.qty+' g':'× '+i.qty}</div></div>
 ${i.w?'':`<button class="btn bg-stone-200 !py-1" onclick="qty(${n},-1)">−</button><button class="btn bg-stone-200 !py-1" onclick="qty(${n},1)">+</button>`}
 <b>${fmt(sub(i))}</b><button class="text-red-600 font-bold px-2" onclick="S.cart.splice(${n},1);renderCart()">✕</button></div>`).join('')||'<p class="text-stone-500">Toca un producto para agregarlo.</p>'}
 <div class="text-3xl font-extrabold text-right">${fmt(t)}</div>
 <div class="grid grid-cols-2 gap-2">${[['efectivo','Efectivo'],['nequi','Nequi'],['daviplata','Daviplata'],['fiado','Fiado']].map(([k,l])=>
 `<button class="btn ${S.method===k?'bg-teal-700 text-white':'bg-stone-200'}" onclick="S.method='${k}';renderCart()">${l}</button>`).join('')}</div>
 ${S.method==='efectivo'?`<div class="flex gap-1 flex-wrap">${[['Exacto',t],['10 mil',10000],['20 mil',20000],['50 mil',50000],['100 mil',100000]].map(([l,v])=>`<button class="btn bg-stone-200 !py-1 !px-2 text-sm" onclick="S.paid=${v};renderCart()">${l}</button>`).join('')}</div><input class="inp text-lg" type="number" placeholder="Recibido $" value="${S.paid||''}" oninput="S.paid=+this.value;chg()"><div class="text-xl font-bold">Devuelta: <span id="chg"></span></div>`:''}
 ${S.method==='fiado'?`<input class="inp" placeholder="Nombre del cliente" value="${esc(S.cust)}" oninput="S.cust=this.value">`:''}
 <button class="btn bg-emerald-600 text-white w-full text-xl" onclick="pay()">Cobrar ${fmt(t)}</button>
 <button class="btn bg-stone-200 w-full" onclick="S.cart=[];renderCart()">Vaciar</button>`;
 chg();const mb=$('#mbar');if(mb){mb.classList.toggle('hidden',!S.cart.length);mb.textContent='🛒 '+S.cart.length+' · '+fmt(t)}
}
window.renderCart=renderCart;
window.chg=()=>{const e=$('#chg');if(e){const d=S.paid-total();e.textContent=S.paid?(d>=0?fmt(d):'Faltan '+fmt(-d)):'—';e.style.color=d<0&&S.paid?'#f87171':''}};
window.qty=(n,d)=>{const i=S.cart[n],p=S.products.find(x=>x.id===i.id);if(d>0&&p&&i.qty+d>p.stock)return toast('No hay más stock');i.qty=Math.max(1,i.qty+d);renderCart()};
window.pay=()=>{
 if(S.busy||!S.cart.length)return;const t=total(),m=S.method;
 if(m==='efectivo'&&S.paid&&S.paid<t)return toast('El dinero recibido no alcanza');
 if(m==='fiado'&&!S.cust.trim())return toast('Escribe el nombre del cliente');
 S.busy=true;const num=(S.biz.consec||0)+1;
 const v={ts:Date.now(),num,method:m,total:t,paid:m==='efectivo'?S.paid||t:t,change:m==='efectivo'&&S.paid?S.paid-t:0,customer:m==='fiado'?S.cust.trim():'',user:S.user,
  items:S.cart.map(i=>({id:i.id,name:i.name,qty:i.qty,w:i.w,price:i.price,subtotal:sub(i)}))};
 const b=writeBatch(db); // descuenta stock + guarda venta + sube el consecutivo
 S.cart.forEach(i=>b.update(doc(db,'products',i.id),{stock:increment(-i.qty)}));
 b.set(doc(collection(db,'sales')),v);b.set(doc(db,'config','negocio'),{consec:increment(1)},{merge:true});
 b.commit().catch(e=>toast('Error al guardar: '+e.message));
 S.cart=[];S.paid=0;S.cust='';S.busy=false;renderCart();
 S.biz.auto===false?toast('Venta registrada '+fmt(t)):showFact(v);
};
// Modal de pesaje (gramos / libras / kilos / valor en pesos)
function openW(p){
 $('#modal').innerHTML=`<div class="fixed inset-0 bg-black/60 flex items-center justify-center p-3 z-50"><div class="bg-white rounded-2xl p-5 w-full max-w-md space-y-3">
 <h3 class="text-xl font-extrabold">${esc(p.name)}</h3><p class="text-sm bg-stone-100 rounded-lg p-2">Libra: <b>${fmt(p.price/2)}</b> · Kilo: <b>${fmt(p.price)}</b></p>
 <div class="grid grid-cols-4 gap-2">${[[250,'250 g<br>½ libra'],[500,'500 g<br>1 libra'],[1000,'1000 g<br>1 kilo'],[2000,'2000 g<br>2 kilos']].map(([g,l])=>`<button class="btn bg-emerald-600 text-white" onclick="addW('${p.id}',${g})">${l}</button>`).join('')}</div>
 <label class="block">Gramos<input id="wg" type="number" class="inp" oninput="wp.value=Math.round(+this.value*${p.price}/1000);wsum()"></label>
 <label class="block">Valor en pesos ($)<input id="wp" type="number" class="inp" oninput="wg.value=Math.round(+this.value/${p.price}*1000);wsum()"></label>
 <p id="wsum" class="font-bold"></p>
 <div class="flex gap-2"><button class="btn bg-stone-200 flex-1" onclick="closeM()">Cancelar</button><button class="btn bg-stone-900 text-white flex-1" onclick="addW('${p.id}',+wg.value)">Agregar</button></div></div></div>`;
 setTimeout(()=>$('#wp').focus(),50);
}
window.wsum=()=>{$('#wsum').textContent=`${$('#wg').value||0} g = ${fmt(+$('#wp').value||0)}`};
window.closeM=()=>$('#modal').innerHTML='';
window.addW=(id,g)=>{const p=S.products.find(x=>x.id===id);if(!g||g<=0)return toast('Ingresa una cantidad');if(g>p.stock)return toast('Solo hay '+p.stock+' g en inventario');addCart(p,Math.round(g));closeM()};

// ================= INVENTARIO + IMPORTADOR =================
const invF={all:()=>true,noprice:p=>p.price<=0,low:p=>p.stock>0&&p.stock<=(p.min||0),out:p=>p.stock<=0};
function invFiltered(){const q=norm(S.fQ);return S.products.filter(p=>(S.fPhase==='all'||p.phase===S.fPhase)&&(S.fSub==='all'||p.sub===S.fSub)&&invF[S.fState||'all'](p)&&(!q||norm(p.name).includes(q)||norm(p.code)===q))}
const fld=(p,f,lb)=>{const k=isW(p)&&(f==='stock'||f==='min');return `<label class="block text-[11px] font-bold text-slate-400">${lb}${k?' (kg)':''}<input class="inp !py-1.5 text-right" data-f="${f}" type="number" step="any" value="${k?+((p[f]||0)/1000).toFixed(3):(p[f]??0)}" onfocus="this.select()" onchange="${k?'setK':'setF'}('${p.id}','${f}',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();nextRow(this)}"></label>`};
function invRow(p){const pr=p.price>0&&p.cost>0?Math.round((p.price-p.cost)/p.cost*100):null,ph=PHASES.find(f=>f.id===p.phase);
 const st=p.stock<=0?'<span class="tag bg-red-100 text-red-700">AGOTADO</span>':p.stock<=(p.min||0)?'<span class="tag bg-amber-200 text-amber-800">BAJO</span>':'';
 return `<div data-row class="rounded-2xl border p-3 ${p.price<=0?'bg-red-50 border-red-500':'bg-white'}">

window.doImport=async()=>{
 const lines=$('#imp').value.split('\n').map(x=>x.trim()).filter(Boolean);
 if(lines[0]&&norm(lines[0]).startsWith('nombre'))lines.shift();
 const byName=new Map(S.products.map(p=>[norm(p.name),p]));let b=writeBatch(db),n=0,tot=0;
 for(const ln of lines){
  const sep=ln.includes('\t')?'\t':ln.includes(';')?';':',';const [name,ph,sb,tp,st,pr]=ln.split(sep).map(x=>x?.trim());
  if(!name)continue;const w=norm(tp).startsWith('g')||norm(tp).startsWith('k');
  const num=x=>+String(x||'0').replace(/[^\d.,-]/g,'').replace(',','.')||0;
  const data={name,phase:findPhase(ph),sub:sb||'',saleType:w?'gramo':'unidad',stock:Math.round(w?num(st)*1000:num(st)),price:Math.round(num(pr)),min:0,cost:0};
  const ex=byName.get(norm(name));
  ex?b.update(doc(db,'products',ex.id),data):b.set(doc(collection(db,'products')),data);
  tot++;if(++n>=400){await b.commit();b=writeBatch(db);n=0}
 }
 await b.commit();toast(tot+' productos importados');$('#imp').value='';
};

function listaTxt(){
 const low=S.products.filter(p=>p.stock<=(p.min||0));if(!low.length)return 'Nada por pedir 🎉';
 let t='*PEDIDO '+new Date().toLocaleDateString('es-CO')+'*\n';
 PHASES.forEach(f=>{const g=low.filter(p=>p.phase===f.id);if(!g.length)return;t+='\n*'+f.n+'*\n';
  [...new Set(g.map(p=>p.sub||''))].forEach(s=>{if(s)t+='_'+s+'_\n';g.filter(p=>(p.sub||'')===s).forEach(p=>t+=`- ${p.name} (quedan ${stockTxt(p)}${p.min?', mín '+(isW(p)?p.min/1000+' kg':p.min):''})\n`)})});
 return t;
}

function shiftStats(){

 const r={ef:sm('efectivo'),nq:sm('nequi'),dv:sm('daviplata'),fi:sm('fiado'),n:S.sales.length,gs:S.expenses.reduce((a,e)=>a+e.amount,0),util:0,cat:{},top:{},cli:{}};
 r.tot=r.ef+r.nq+r.dv+r.fi;
 S.sales.forEach(v=>{if(v.method==='fiado')r.cli[v.customer]=(r.cli[v.customer]||0)+v.total;
  v.items.forEach(i=>{const p=S.products.find(x=>x.id===i.id);
   r.util+=i.subtotal-(p?(i.w?i.qty*p.cost/1000:i.qty*p.cost):0);
   const f=p?.phase||'otro';r.cat[f]=(r.cat[f]||0)+i.subtotal;
   const t=r.top[i.name]||(r.top[i.name]={q:0,v:0,w:i.w});t.q+=i.qty;t.v+=i.subtotal})});
 r.esp=S.base+r.ef-r.gs;return r}

window.seed=async()=>{
 if(S.products.length&&!confirm('Se agregarán los productos de ejemplo que aún no tengas. ¿Continuar?'))return;
 const have=new Set(S.products.map(p=>norm(p.name)));let b=writeBatch(db),ph,sb,n=0;
 for(const l of SEED.split('\n')){
  if(l[0]==='#'){[ph,sb]=l.slice(1).split('|');continue}
  const [name,t,st,mn,co,pr]=l.split('|');if(have.has(norm(name)))continue;
  b.set(doc(collection(db,'products')),{name,phase:ph,sub:sb,saleType:t==='g'?'gramo':'unidad',stock:+st,min:+mn,cost:+co,price:+pr});n++}
 if(!n)return toast('Ya tienes todos los productos de ejemplo');
 await b.commit();toast(n+' productos colombianos cargados (los de precio $0 salen en rojo)')};
// Funciones usadas desde onclick/oninput en el HTML
// ================= FACTURA Y DATOS DEL NEGOCIO =================
window.quickAdd=()=>{const q=norm(S.q);if(!q)return;
 const l=S.products.filter(p=>(S.phase==='all'||p.phase===S.phase)&&(norm(p.name).includes(q)||norm(p.code)===q));
 if(l.length===1){pick(l[0].id);S.q='';$('#q').value='';renderGrid()}else toast(l.length?l.length+' resultados, toca el que quieres':'Sin resultados')};
function factHTML(v){const B=S.biz,L=(a,b)=>`<div style="display:flex;justify-content:space-between;gap:8px"><span>${a}</span><span>${b}</span></div>`;
 return `<div id="invp" style="background:#fff;color:#000;font:12px/1.4 'Courier New',monospace;padding:14px;width:100%;max-width:320px;margin:auto;border-radius:8px">
 <div style="text-align:center"><b style="font-size:15px">${esc(B.name||'MI NEGOCIO')}</b>${B.nit?`<div>NIT: ${esc(B.nit)}</div>`:''}${B.address?`<div>${esc(B.address)}</div>`:''}${B.phone?`<div>Tel: ${esc(B.phone)}</div>`:''}</div><hr>
 <div><b>FACTURA DE VENTA No. ${String(v.num||0).padStart(6,'0')}</b></div><div>${new Date(v.ts).toLocaleString('es-CO')}</div>${v.customer?`<div>Cliente: ${esc(v.customer)}</div>`:''}<hr>
 ${v.items.map(i=>`<div>${esc(i.name)}</div>`+L(i.w?i.qty+' g':i.qty+' x '+fmt(i.price),fmt(i.subtotal))).join('')}<hr>
 ${L('<b>TOTAL</b>','<b>'+fmt(v.total)+'</b>')}${L('Pago',v.method)}${v.method==='efectivo'?L('Recibido',fmt(v.paid))+L('Devuelta',fmt(v.change)):''}<hr>
 <div style="text-align:center">${esc(B.footer||'¡Gracias por su compra!')}</div></div>`}
window.showFact=v=>{window._fv=v;$('#modal').innerHTML=`<div class="fixed inset-0 bg-black/70 z-50 overflow-y-auto p-3"><div class="max-w-sm mx-auto space-y-2 mt-3">
 ${S.biz.name?'':'<div class="bg-amber-50 border border-amber-200 rounded-xl p-2 text-sm">Agrega el nombre, NIT y dirección de tu negocio en el menú ⚙️ Negocio.</div>'}
 ${factHTML(v)}<div class="grid grid-cols-3 gap-2 pb-6"><button class="btn bg-emerald-600 text-white" onclick="print()">🖨 Imprimir</button><button class="btn bg-stone-200" onclick="factCopy()">📋 Copiar</button><button class="btn bg-slate-700 text-white" onclick="closeM()">Cerrar</button></div></div></div>`};
window.factCopy=()=>{const v=window._fv,B=S.biz;
 const t=[B.name||'MI NEGOCIO',B.nit?'NIT: '+B.nit:'',B.address||'',B.phone?'Tel: '+B.phone:'','FACTURA No. '+String(v.num||0).padStart(6,'0'),new Date(v.ts).toLocaleString('es-CO'),'',
  ...v.items.map(i=>`${i.name} ${i.w?i.qty+'g':'x'+i.qty} ${fmt(i.subtotal)}`),'','TOTAL: '+fmt(v.total),'Pago: '+v.method,B.footer||'¡Gracias por su compra!'].filter(x=>x!=='').join('\n');
 navigator.clipboard.writeText(t).then(()=>toast('Factura copiada, pégala en WhatsApp'))};
function negView(){const B=S.biz,f=(id,l,ph,v)=>`<label class="block text-sm">${l}<input id="${id}" class="inp" placeholder="${ph}" value="${esc(v||'')}"></label>`;
 $('#main').innerHTML=`<div class="bg-white rounded-2xl shadow p-4 max-w-xl space-y-3"><h2 class="text-xl font-extrabold">Datos del negocio</h2><p class="text-sm text-stone-500">Aparecen en la factura.</p>
 ${f('bN','Nombre del negocio','Minimercado La Esquina',B.name)}${f('bT','NIT','900.123.456-7',B.nit)}${f('bD','Dirección','Cra 7 # 10-20, Pereira',B.address)}${f('bP','Teléfono','300 123 4567',B.phone)}${f('bF','Mensaje al final','¡Gracias por su compra!',B.footer)}
 <label class="flex items-center gap-2 font-bold"><input id="bA" type="checkbox" ${B.auto===false?'':'checked'}> Mostrar la factura al cobrar</label>
 <label class="block text-sm">Próximo número de factura<input id="bC" class="inp" type="number" value="${(B.consec||0)+1}"></label>
 <button class="btn bg-emerald-600 text-white w-full" onclick="saveBiz()">Guardar</button></div>`}
window.saveBiz=()=>{setDoc(doc(db,'config','negocio'),{name:$('#bN').value.trim(),nit:$('#bT').value.trim(),address:$('#bD').value.trim(),phone:$('#bP').value.trim(),footer:$('#bF').value.trim(),
 auto:$('#bA').checked,consec:Math.max(0,(+$('#bC').value||1)-1)},{merge:true}).catch(e=>toast(e.message));toast('Datos guardados ✔')};
Object.assign(window,{$,toast,esc,fmt,invView,faltView,entView,cuadreView,negView,posView,shell});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._dp=e;$('#inst')?.classList.remove('hidden')});
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
try{S.user=localStorage.getItem('pos_user')}catch(e){}
S.user?start():loginView();
</script></body></html>
